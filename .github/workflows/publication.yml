name: Publication content checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go test ./...
        working-directory: scripts
      - run: go run scripts/check-publication.go
