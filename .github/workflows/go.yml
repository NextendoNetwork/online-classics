name: Go server checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  account-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/accountauth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go test ./... -timeout 60s
      - run: go vet ./...
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [genesis, gba, snes, nes, gb, n64, n64/lab]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: servers/${{ matrix.server }}/go.sum
      - run: go test ./... -timeout 60s
      - run: go vet ./...
      - run: go build -o server .
